# Kompilasi + tes otomatis di GitHub (tanpa perlu Go di HP/PC). Jalankan: tab Actions -> build -> Run workflow.
# Semua langkah memakai "if: always()" supaya SATU kali jalan menampilkan semua error sekaligus.
name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: go mod tidy
        run: go mod tidy
      - name: go vet
        if: always()
        run: go vet ./...
      - name: go test
        if: always()
        run: go test ./...
      - name: build (linux amd64)
        if: always()
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o cu .
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: cu-linux-amd64
          path: cu
